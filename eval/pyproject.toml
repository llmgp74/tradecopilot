[project]
name = "tradecopilot-eval"
version = "0.1.0"
description = "Evaluation harness for TradeCopilot."
requires-python = ">=3.12,<3.14"
dependencies = ["tradecopilot-agent"]

[tool.uv.sources]
tradecopilot-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradecopilot_eval"]
