[project]
name = "tradecopilot-agent"
version = "0.1.0"
description = "TradeCopilot agent library and API server."
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepagents>=0.7.32,<0.8",
  "fastapi>=0.162.0,<1",
  "httpx>=0.28.1,<1",
  "langchain-deepseek>=1.1.1",
  "langgraph>=1.2.19,<2",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pydantic-settings>=2.16.2,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.scripts]
tradecopilot = "tradecopilot_agent.server.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.4.1,<3",
  "pytest>=9.2.0,<10",
  "ruff>=0.17.3,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradecopilot_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
