name: desktop

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          target: aarch64-apple-darwin
          artifacts: |
            ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          artifacts: |
            ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: astral-sh/setup-uv@v5
    - run: uv sync --frozen
    - run: npm ci
      working-directory: ui
    # cargo test runs the Tauri build script, which requires the resources.
    - run: node scripts/stage-resources.mjs
      working-directory: ui
    - run: cargo test
      working-directory: ui/src-tauri
    - run: npm run tauri build -- --target ${{ matrix.target }}
      working-directory: ui
    - uses: actions/upload-artifact@v4
      with:
        name: tradecopilot-${{ matrix.target }}
        path: ${{ matrix.artifacts }}
